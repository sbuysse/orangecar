[workspace]
resolver = "2"
members = ["carplay", "app", "agent", "experimental/bridge", "experimental/headunit"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# --- Common deps shared across members (opt-in via `workspace = true`) ---
# CLI (app, bridge, headunit)
clap = { version = "4", features = ["derive"] }
# TLS for AA protocol (bridge, headunit)
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
# Protobuf (bridge, headunit)
prost = "0.13"
# Bit flags (bridge, headunit)
bitflags = "2"
# Byte buffers (bridge, headunit)
bytes = "1"
# HTTP client for weather/calendar (app)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
# Linux syscalls / USB gadget (bridge)
nix = { version = "0.29", features = ["fs", "ioctl", "poll"] }
libc = "0.2"
