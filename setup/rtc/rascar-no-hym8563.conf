# /etc/modprobe.d/rascar-no-hym8563.conf
# HYM8563 RTC of the Orange Pi 5 Plus: with no backup battery fitted it never
# holds a valid time at boot, and its interrupt line stays active: ~4600 IRQ/s,
# its IRQ thread permanently in D state (load average ~1.5 on an idle board) and
# constant traffic on I2C bus 6, which it shares with the fusb302 USB-C
# controller the CarPlay role switch depends on. Time comes from NTP, the car's
# GPS (over iAP2) and fake-hwclock instead.
# Remove this file (and disable rascar-rtc-off.service) if a coin cell is fitted.
blacklist rtc_hym8563
install rtc_hym8563 /bin/false
