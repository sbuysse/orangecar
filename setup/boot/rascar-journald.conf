# /etc/systemd/journald.conf.d/20-rascar-powercut.conf
# Power is cut without warning at every ignition-off: keep the journal on disk
# (armbian-ramlog is disabled by install.sh, so /var/log is on the NVMe) and
# sync it every 5 s, so a drive's log survives to the next boot.
[Journal]
Storage=persistent
SystemMaxUse=200M
SyncIntervalSec=5s
