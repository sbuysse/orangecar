# Throttle udev so the boot-time driver probes are spread out instead of all
# running at ~6 s. Removed on 2026-09-30 (touch/sound/4G came up 50-85 s late);
# from then on 8 of 22 car boots lost the NVMe ~6 s in: every unit that had to
# exec from the root fs failed (tmp.mount, emergency.service, ...) while PID 1
# kept running. 0 of 18 boots failed with this cap. The likely cause is the
# probe surge sagging the car's USB-C supply; drop this only once the board has
# a stronger power feed. GPU + sound are loaded by modules-load, not udev
# (rascar-early-drivers.conf), so the cap doesn't delay loading them.
# Install to /etc/systemd/system/systemd-udevd.service.d/.
[Service]
CPUQuota=10%
