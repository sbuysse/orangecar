# Load the GPU and sound drivers at the start of boot (systemd-modules-load,
# ~7 s). Left to udev's on-demand loading they came up very late on 2026-09-30
# (GPU 34-44 s, sound card ~100 s: udev spends minutes on zram/NVMe), after the
# CarPlay service had started the kiosk (~11 s) and after the car connected:
# the Wayland kiosk had no GPU and the car got silence for the first minutes.
# The card also waits for its amplifiers (snd_soc_simple_amplifier): without
# it the card still came at 72 s on the first boot with this file.
# Install to /etc/modules-load.d/.
panthor
snd_soc_rockchip_i2s_tdm
snd_soc_es8328_i2c
snd_soc_simple_amplifier
snd_soc_simple_card
