[package]
name = "rascar-agent"
version = "0.1.0"
edition = "2024"
description = "OrangeCar maintenance agent: optional log push and signed OTA releases from a self-hosted update server"

[lib]
name = "rascar_agent"
path = "src/lib.rs"

# Runs on the car (root service).
[[bin]]
name = "rascar-agent"
path = "src/bin/rascar-agent.rs"

# Runs on the dev machine: key generation, manifest, signing (tools/release.sh).
[[bin]]
name = "rascar-release"
path = "src/bin/rascar-release.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
# ed25519 signatures + SHA-256 (already in the tree through rustls).
ring = "0.17"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
glob = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
