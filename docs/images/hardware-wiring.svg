<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>OrangeCar wiring</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Car -->
  <rect x="20" y="20" width="250" height="560" rx="10" fill="#f2f4f7" stroke="#555"/>
  <text x="145" y="45" text-anchor="middle" font-weight="bold" font-size="15">Car</text>
  <rect x="40" y="70" width="210" height="110" rx="6" fill="#fff" stroke="#555"/>
  <text x="145" y="92" text-anchor="middle" font-weight="bold">Head unit (CarPlay port)</text>
  <text x="145" y="112" text-anchor="middle">USB: sources 5 V VBUS</text>
  <text x="145" y="130" text-anchor="middle">touchscreen, speakers, mic,</text>
  <text x="145" y="148" text-anchor="middle">GPS, steering-wheel keys</text>
  <text x="145" y="166" text-anchor="middle" fill="#666">all reach the board over USB</text>

  <rect x="40" y="250" width="210" height="80" rx="6" fill="#fff" stroke="#555"/>
  <text x="145" y="272" text-anchor="middle" font-weight="bold">12 V supply</text>
  <text x="145" y="292" text-anchor="middle">accessory socket or a</text>
  <text x="145" y="310" text-anchor="middle">fused, switched 12 V feed</text>

  <rect x="40" y="440" width="210" height="80" rx="6" fill="#fff" stroke="#555"/>
  <text x="145" y="462" text-anchor="middle" font-weight="bold">OBD-II socket</text>
  <text x="145" y="482" text-anchor="middle">ELM327 Bluetooth adapter</text>
  <text x="145" y="500" text-anchor="middle">(classic BT / SPP)</text>

  <!-- 12V -> 5V -->
  <rect x="300" y="250" width="150" height="80" rx="6" fill="#fff8e6" stroke="#b07d00"/>
  <text x="375" y="272" text-anchor="middle" font-weight="bold">12 V to 5 V</text>
  <text x="375" y="292" text-anchor="middle">at least 5 V / 4 A,</text>
  <text x="375" y="310" text-anchor="middle">dedicated to the board</text>
  <line x1="250" y1="290" x2="298" y2="290" stroke="#b07d00" stroke-width="3" marker-end="url(#a)"/>

  <!-- Board -->
  <rect x="490" y="20" width="450" height="560" rx="10" fill="#fff3ec" stroke="#c0501f" stroke-width="2"/>
  <text x="715" y="45" text-anchor="middle" font-weight="bold" font-size="15">Orange Pi 5 Plus (RK3588)</text>

  <rect x="510" y="70" width="190" height="70" rx="6" fill="#fff" stroke="#c0501f"/>
  <text x="605" y="92" text-anchor="middle" font-weight="bold">USB-C OTG / data port</text>
  <text x="605" y="110" text-anchor="middle">usb@fc000000 + fusb302</text>
  <text x="605" y="128" text-anchor="middle" fill="#666">device, then host</text>

  <rect x="510" y="250" width="190" height="70" rx="6" fill="#fff" stroke="#c0501f"/>
  <text x="605" y="272" text-anchor="middle" font-weight="bold">USB-C power input</text>
  <text x="605" y="290" text-anchor="middle">fixed 5 V, no PD</text>
  <text x="605" y="308" text-anchor="middle" fill="#666">power only</text>

  <rect x="720" y="70" width="200" height="70" rx="6" fill="#fff" stroke="#c0501f"/>
  <text x="820" y="92" text-anchor="middle" font-weight="bold">M.2 M-key: NVMe SSD</text>
  <text x="820" y="110" text-anchor="middle">root filesystem</text>
  <text x="820" y="128" text-anchor="middle" fill="#666">heatsink recommended</text>

  <rect x="720" y="160" width="200" height="70" rx="6" fill="#fff" stroke="#c0501f"/>
  <text x="820" y="182" text-anchor="middle" font-weight="bold">M.2 E-key: Wi-Fi/BT card</text>
  <text x="820" y="200" text-anchor="middle">Wi-Fi = debug hotspot</text>
  <text x="820" y="218" text-anchor="middle" fill="#666">fit both antennas</text>

  <rect x="720" y="250" width="200" height="70" rx="6" fill="#fff" stroke="#c0501f"/>
  <text x="820" y="272" text-anchor="middle" font-weight="bold">Fan header (2-pin)</text>
  <text x="820" y="290" text-anchor="middle">40 mm 5 V fan</text>
  <text x="820" y="308" text-anchor="middle" fill="#666">optional, recommended</text>

  <rect x="510" y="360" width="190" height="90" rx="6" fill="#fff" stroke="#c0501f"/>
  <text x="605" y="382" text-anchor="middle" font-weight="bold">USB 2.0 Type-A ports</text>
  <text x="605" y="400" text-anchor="middle">direct root ports</text>
  <text x="605" y="420" text-anchor="middle">4G modem (SIM7600)</text>
  <text x="605" y="438" text-anchor="middle">USB Bluetooth dongle</text>

  <rect x="720" y="360" width="200" height="90" rx="6" fill="#fff" stroke="#c0501f"/>
  <text x="820" y="382" text-anchor="middle" font-weight="bold">USB 3.0 Type-A ports</text>
  <text x="820" y="400" text-anchor="middle">behind on-board GL3523 hub</text>
  <text x="820" y="420" text-anchor="middle">(shared with the M.2 card's</text>
  <text x="820" y="438" text-anchor="middle">Bluetooth) - avoid for radios</text>

  <rect x="510" y="480" width="410" height="80" rx="6" fill="#fff" stroke="#c0501f"/>
  <text x="715" y="502" text-anchor="middle" font-weight="bold">Ethernet (bench only)</text>
  <text x="715" y="522" text-anchor="middle">at home: SSH over the LAN; no carrier = in the car,</text>
  <text x="715" y="540" text-anchor="middle">so the debug hotspot may start on the Wi-Fi card</text>

  <!-- Car USB link -->
  <line x1="250" y1="105" x2="508" y2="105" stroke="#1f5fbf" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="380" y="95" text-anchor="middle" fill="#1f5fbf" font-weight="bold">one direct USB cable</text>
  <text x="380" y="125" text-anchor="middle" fill="#1f5fbf">no hub, no extension</text>
  <text x="380" y="142" text-anchor="middle" fill="#1f5fbf">data + car's VBUS only</text>

  <!-- Power -->
  <line x1="450" y1="290" x2="508" y2="290" stroke="#b07d00" stroke-width="3" marker-end="url(#a)"/>
  <text x="375" y="350" text-anchor="middle" fill="#b07d00">short, thick USB-C cable</text>
  <text x="375" y="366" text-anchor="middle" fill="#b07d00">to the power input only</text>

  <!-- OBD BT link -->
  <path d="M250,480 C380,480 420,420 508,415" fill="none" stroke="#2a8a3a" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#a)"/>
  <text x="365" y="500" text-anchor="middle" fill="#2a8a3a">Bluetooth (RFCOMM)</text>
</svg>
