[package]
name = "rascar-bridge"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rascar-bridge"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# USB gadget I/O
nix = { version = "0.29", features = ["fs", "ioctl", "poll"] }

# TLS for AA protocol
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"                # Self-signed cert generation

# Protobuf (lightweight)
prost = "0.13"

# Bit flags
bitflags = "2"
libc = "0.2"

# Async helpers
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# X11 XTest input injection (no-subprocess mouse event injection for Xvfb)
x11rb = { version = "0.13", features = ["xtest"] }
